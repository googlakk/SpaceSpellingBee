<!DOCTYPE html>
<html>
<head>
    <title>ElevenLabs API Test</title>
</head>
<body>
    <h1>ElevenLabs API Tester</h1>

    <div>
        <label>API Key:</label>
        <input type="text" id="apiKey" value="sk_d8ba290a641ce24fbfeee6ea6b4b9d9007659e4f3a09d53f" style="width: 400px">
    </div>

    <div style="margin-top: 10px;">
        <button onclick="testVoices()">Test Get Voices</button>
        <button onclick="testTTS()">Test TTS</button>
    </div>

    <div id="result" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace;"></div>

    <script>
        async function testVoices() {
            const apiKey = document.getElementById('apiKey').value;
            const result = document.getElementById('result');
            result.textContent = 'Testing...';

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/voices', {
                    headers: {
                        'xi-api-key': apiKey
                    }
                });

                const text = await response.text();

                if (response.ok) {
                    const data = JSON.parse(text);
                    result.textContent = `✅ SUCCESS!\n\nFound ${data.voices.length} voices:\n\n` +
                        JSON.stringify(data, null, 2);
                } else {
                    result.textContent = `❌ ERROR ${response.status}\n\n${text}`;
                }
            } catch (error) {
                result.textContent = `❌ NETWORK ERROR\n\n${error.message}`;
            }
        }

        async function testTTS() {
            const apiKey = document.getElementById('apiKey').value;
            const result = document.getElementById('result');
            result.textContent = 'Testing TTS...';

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/nPczCjzI2devNBz1zQrb', {
                    method: 'POST',
                    headers: {
                        'xi-api-key': apiKey,
                        'Content-Type': 'application/json',
                        'Accept': 'audio/mpeg'
                    },
                    body: JSON.stringify({
                        text: 'hello',
                        model_id: 'eleven_multilingual_v2',
                        voice_settings: {
                            stability: 0.54,
                            similarity_boost: 0.47,
                            style: 0.47,
                            use_speaker_boost: true
                        }
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    result.textContent = `✅ TTS SUCCESS!\n\nGenerated ${blob.size} bytes of audio`;

                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.play();
                } else {
                    const text = await response.text();
                    result.textContent = `❌ ERROR ${response.status}\n\n${text}`;
                }
            } catch (error) {
                result.textContent = `❌ NETWORK ERROR\n\n${error.message}`;
            }
        }
    </script>
</body>
</html>
